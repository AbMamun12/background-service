name: background_service
description: "A Background Service app for DeskFit with scheduled timers, notifications, standing overlay and looping alarm sound."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.0.0
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  intl: ^0.20.2
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
